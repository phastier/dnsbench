# ============================================================
#  public-dns.conf - panel for comparing PUBLIC DNS resolvers
#  Run with:  ./dnsbench -c examples/public-dns.conf --sort p50 --html public.html
#
#  Strategy: public resolvers rate-limit and apply DoS protection (DNS4EU caps
#  at ~1000 qps/IP; Cloudflare/Google throttle random NXDOMAIN floods), so the
#  cache-MISS is slow and noisy here and not meaningful. We therefore run HIT
#  ONLY (mode = hit): fast, and the right comparison for public resolvers.
#  Flip to "both" if you specifically want to probe their recursion.
#
#  parallel = yes: fan out one query per resolver at once (poll-based). With ~20
#  public resolvers at 10-40 ms each, this collapses a round from sum(latencies)
#  to ~max(latency). One request in flight per resolver, so per-resolver latency
#  stays valid; just don't compare these numbers against a sequential run.
# ============================================================

mode = hit
parallel = yes
rounds = 300
timeout_sec = 1
qtype = A

# Unused while mode=hit, but set sanely in case you flip to both.
miss_base = whoami.example

[hit_domains]
www.apple.com
www.cloudflare.com
en.wikipedia.org

[resolvers]
# --- Cloudflare: standard / malware-blocking / malware+adult ---
1.1.1.1                  cf
2606:4700:4700::1111     cf-v6
1.1.1.2                  cf-malware
2606:4700:4700::1112     cf-malware-v6
1.1.1.3                  cf-family
2606:4700:4700::1113     cf-family-v6

# --- Google (no public filtered variant; primary + secondary) ---
8.8.8.8                  google
2001:4860:4860::8888     google-v6
8.8.4.4                  google-2
2001:4860:4860::8844     google-2-v6

# --- DNS4EU (EU sovereign, Whalebone/Knot Resolver). Official joindns4.eu IPs ---
# protective=.1  child=.12  adblock=.13  child+adblock=.11  unfiltered=.100
86.54.11.1               dns4eu-protective
2a13:1001::86:54:11:1    dns4eu-protective-v6
86.54.11.12              dns4eu-child
2a13:1001::86:54:11:12   dns4eu-child-v6
86.54.11.13              dns4eu-adblock
2a13:1001::86:54:11:13   dns4eu-adblock-v6
86.54.11.11              dns4eu-child-adblock
2a13:1001::86:54:11:11   dns4eu-child-adblock-v6
86.54.11.100             dns4eu-unfiltered
2a13:1001::86:54:11:100  dns4eu-unfiltered-v6
